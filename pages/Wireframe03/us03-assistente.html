<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulbe Energia | Assistente Bulbe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../templates/template2.css">
    <link rel="stylesheet" href="us03.css">
</head>
<body>
    <header>
        <a class="header-back" href="javascript:history.back()" aria-label="Voltar">
            <img src="../templates/assets/Icon-voltar.svg" alt="">
        </a>
        <img class="header-logo" src="../templates/assets/logo-bulbe.svg" alt="Bulbe Energia">
    </header>

    <main id="content" class="chat-page">
        <div class="page-heading">
            <div>
                <h1 class="page-title">Assistente Bulbe</h1>
                <p class="status-online">Responde na hora</p>
            </div>
            <a class="round-button" href="us03-atendimentos.html" aria-label="Meus atendimentos">
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>
            </a>
        </div>

        <section class="chat-messages" aria-label="Conversa com o Assistente Bulbe">
            <p class="date-chip">Hoje, 10:42</p>

            <div class="notice notice-info">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                <p>Sou um assistente automático da Bulbe. Posso responder dúvidas e gerar 2ª via de faturas.</p>
            </div>

            <div class="message message-bot">
                <p class="bubble">Oi, Ana! Como posso ajudar você hoje?</p>
                <span class="message-time">10:42</span>
            </div>

            <h2 class="chat-label">Sugestões rápidas</h2>
            <div class="option-list">
                <a class="option" href="us03-reenviar.html">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg>
                    <span>Reenviar minha fatura</span>
                    <svg class="icon icon-sm chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </a>
                <a class="option" href="#">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>Outro assunto</span>
                    <svg class="icon icon-sm chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </a>
            </div>
        </section>

        <div class="chat-composer">
            <form class="composer-form" action="#">
                <div class="composer-field">
                    <label class="sr-only" for="mensagem">Mensagem</label>
                    <input class="composer-input" id="mensagem" type="text" placeholder="Digite uma mensagem..." autocomplete="off">
                    <button class="composer-attach" type="button" aria-label="Anexar arquivo">
                        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                </div>
                <button class="composer-send" type="submit" aria-label="Enviar mensagem">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 21 12 4 4l2.5 8L4 20Z"/><path d="M6.5 12H12"/></svg>
                </button>
            </form>
            <p class="composer-note">
                <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Atendimento protegido com criptografia
            </p>
        </div>
    </main>
</body>
</html>
